# yaml-language-server: $schema=https://raw.githubusercontent.com/RashKash103/get-cooked/main/schema/ingredients.schema.json
#
# Shared ingredient database. Recipes refer to these keys with `ingredient:`
# (or are matched automatically by name/alias). Densities enable converting
# between cups and grams; `round` controls how counted items are rounded.

# Densities are { value, unit } with units such as g/cup, g/ml, g/cm3, kg/l,
# g/tbsp, oz/cup or lb/gal (the schema lists them all).

